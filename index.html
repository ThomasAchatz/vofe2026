<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#122019">
<title>Zelt Weckmann · Helfer-App</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ===================== LOGIN ===================== -->
  <div id="login-screen">
    <div class="login-header">
      <div class="login-mono">W</div>
      <div class="login-title">Zelt Weckmann</div>
      <div class="login-sub">Gäubodenvolksfest &middot; Helferzugang</div>
    </div>
    <div class="login-body">
      <div class="field-label">Team-Code eingeben</div>
      <input id="code-input" class="code-input" type="text" placeholder="z. B. ROT3" autocapitalize="characters" autocomplete="off" maxlength="8">
      <div class="error-msg" id="login-error"></div>
      <button class="btn" id="login-btn">Anmelden</button>
      <div class="hint">Dein Code steht auf deinem Helfer-Ausweis,<br>z. B. <b>ROT3</b> oder <b>BOX1</b></div>
      <div class="footer-note">Frag deinen Zeltmeister, falls dein Code nicht funktioniert.</div>
      <div class="team-legend" id="team-legend"></div>
    </div>
  </div>

  <!-- ===================== TEAM-WECHSEL DROPDOWN ===================== -->
  <div id="team-switch-overlay" class="switch-overlay hidden">
    <div class="switch-sheet">
      <div class="switch-sheet-title">Team wechseln</div>
      <div id="team-switch-list"></div>
      <button class="btn" id="team-switch-close" style="background:transparent; color:var(--text-mute); margin-top:8px;">Abbrechen</button>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app-screen" class="hidden">
    <div class="header">
      <div class="brand">
        <div class="brand-left">
          <div class="monogram" id="home-link" role="button" tabindex="0">W</div>
          <div>
            <div class="brand-name">Zelt Weckmann</div>
            <div class="brand-team" id="brand-team">–</div>
          </div>
        </div>
        <button class="badge" id="brand-badge">–</button>
      </div>
    </div>

    <div class="content">
      <div class="view" id="view-heute"></div>
      <div class="view" id="view-karte"></div>
      <div class="view" id="view-reservierungen"></div>
      <div class="view" id="view-stornos"></div>
      <div class="view" id="view-infos"></div>
    </div>

    <div class="tabbar">
      <button class="tabitem" data-tab="heute">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>
        <div>Heute</div>
      </button>
      <button class="tabitem" data-tab="karte">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12h5M9.5 15h5M9.5 9h2"/></svg>
        <div>Downloads</div>
      </button>
      <button class="tabitem" data-tab="reservierungen">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 10h17M9.5 10v9.5"/></svg>
        <div>Reserv.</div>
      </button>
      <button class="tabitem" data-tab="stornos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6.5 6.5l11 11"/></svg>
        <div>Stornos</div>
      </button>
      <button class="tabitem" data-tab="infos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="8" r="0.6" fill="currentColor"/></svg>
        <div>Infos</div>
      </button>
    </div>
  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
